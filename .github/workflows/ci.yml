# Format check, static analysis and tests for the Flutter package (CLAUDE.md, "Hard constraints").
#
# Triggers: pull requests (to develop and to main), and workflow_call so that release workflows can
# reuse it as a `checks` job. There is deliberately no `push` trigger here.
#
# Until the package is scaffolded (docs/project_plan.md section 7, Step 1) there is no pubspec.yaml;
# the checks are then skipped instead of failing. Tests that need the prebuilt FFmpeg binaries are
# added to this workflow together with tool/fetch_prebuilt.sh.
name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect the package
        id: package
        run: |
          if [ -f pubspec.yaml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::pubspec.yaml not found; Flutter checks skipped"
          fi

      # Keep flutter-version in step with the local toolchain (`flutter --version`).
      - name: Set up Flutter
        if: steps.package.outputs.present == 'true'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.35.6
          cache: true

      - name: Install dependencies
        if: steps.package.outputs.present == 'true'
        run: flutter pub get

      - name: Check formatting
        if: steps.package.outputs.present == 'true'
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        if: steps.package.outputs.present == 'true'
        run: flutter analyze

      - name: Test
        if: steps.package.outputs.present == 'true'
        run: flutter test
