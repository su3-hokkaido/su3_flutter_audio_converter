# Builds the prebuilt FFmpeg and LAME libraries on a runner per OS and publishes them as a GitHub
# Release (docs/project_plan.md section 6.2). Nothing built here is committed to git.
#
# Triggers:
#   - push of a tag prebuilt-v<N>: build everything and create the Release. The tag must equal
#     PREBUILT_TAG in build/versions.env at the tagged commit.
#   - workflow_dispatch: build everything and keep the archives as workflow artifacts only (no
#     Release). Use it to try the build scripts, in particular the Windows one, which has not been
#     run yet (docs/2026-10-22_04_m4-windows/design.md).
#
# The Release carries the platform archives, the pinned FFmpeg and LAME source tarballs, the build
# scripts and SHA256SUMS, so that anyone can rebuild identical binaries (LGPL, section 5.4).
name: Prebuilt

on:
  push:
    tags: ['prebuilt-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  ARTIFACT_RETENTION_DAYS: 14

jobs:
  macos:
    name: Build macOS
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: |
          build/ffmpeg/fetch_sources.sh
          build/ffmpeg/build_macos.sh > build/work/build-macos.log 2>&1 || { tail -n 80 build/work/build-macos.log; exit 1; }
          build/ffmpeg/package_macos.sh
          build/ffmpeg/package_release.sh macos

      # AddressSanitizer / UBSan run of the C wrapper against the fresh libraries.
      - name: Native tests
        run: tool/run_native_tests_macos.sh

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prebuilt-macos
          path: build/work/release/su3-prebuilt-macos.tar.gz
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  ios:
    name: Build iOS
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: |
          build/ffmpeg/fetch_sources.sh
          build/ffmpeg/build_ios.sh > build/work/build-ios.log 2>&1 || { tail -n 80 build/work/build-ios.log; exit 1; }
          build/ffmpeg/package_ios.sh
          build/ffmpeg/package_release.sh ios

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prebuilt-ios
          path: build/work/release/su3-prebuilt-ios.tar.gz
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  android:
    name: Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # build_android.sh needs the NDK pinned in build/versions.env; the runner image may carry
      # a different one.
      - name: Install the NDK
        run: |
          source build/versions.env
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ANDROID_NDK_VERSION" > /dev/null

      - name: Build
        run: |
          build/ffmpeg/fetch_sources.sh
          build/ffmpeg/build_android.sh > build/work/build-android.log 2>&1 || { tail -n 80 build/work/build-android.log; exit 1; }
          build/ffmpeg/package_release.sh android

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prebuilt-android
          path: build/work/release/su3-prebuilt-android.tar.gz
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  windows:
    name: Build Windows
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # The shell scripts must keep LF line endings.
      - name: Keep LF line endings
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Puts the x64 MSVC tools (cl, link, lib, dumpbin) in the environment that MSYS2 inherits.
      - name: Set up the MSVC environment
        uses: ilammy/msvc-dev-cmd@f623b2ff849ac04052666adaace67c2365850567 # v1.12.1
        with:
          arch: x64

      - name: Set up MSYS2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: MSYS
          update: false
          path-type: inherit
          install: make diffutils tar xz curl nasm pkgconf

      - name: Build
        run: |
          # MSYS2's /usr/bin/link (coreutils) must not shadow the MSVC link.exe.
          msvc_bin="$(dirname "$(command -v cl)")"
          export PATH="$msvc_bin:$PATH"
          mkdir -p build/work
          build/ffmpeg/build_windows.sh > build/work/build-windows.log 2>&1 || { tail -n 120 build/work/build-windows.log; exit 1; }
          tail -n 30 build/work/build-windows.log
          build/ffmpeg/package_release.sh windows

      # The full log is the first thing needed when this unverified script fails.
      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-windows-log
          path: |
            build/work/build-windows.log
            build/work/build-windows/ffmpeg/ffbuild/config.log
          if-no-files-found: ignore
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prebuilt-windows
          path: build/work/release/su3-prebuilt-windows.tar.gz
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  release:
    name: Create the Release
    needs: [macos, ios, android, windows]
    if: startsWith(github.ref, 'refs/tags/prebuilt-v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the Release
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag against versions.env
        run: |
          source build/versions.env
          if [ "$GITHUB_REF_NAME" != "$PREBUILT_TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME differs from PREBUILT_TAG=$PREBUILT_TAG in build/versions.env"
            exit 1
          fi

      - name: Download the platform archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: prebuilt-*
          path: release
          merge-multiple: true

      # LGPL: the corresponding source (pinned tarballs, checksum verified) and the build scripts.
      - name: Collect the source and the build scripts
        run: |
          build/ffmpeg/fetch_sources.sh
          source build/versions.env
          cp "build/work/src/ffmpeg-$FFMPEG_VERSION.tar.xz" "build/work/src/lame-$LAME_VERSION.tar.gz" release/
          git archive --format=tar.gz -o release/su3-build-scripts.tar.gz HEAD build tool LICENSE
          cat > release/BUILD-INFO.txt <<EOF
          Prebuilt libraries for su3_flutter_audio_converter ($GITHUB_REF_NAME)
          Commit: $GITHUB_SHA

          FFmpeg $FFMPEG_VERSION and LAME $LAME_VERSION, built in an LGPL-only configuration
          (no --enable-gpl, no --enable-nonfree, no libfdk-aac) as shared libraries.

          The corresponding source is attached: ffmpeg-$FFMPEG_VERSION.tar.xz and lame-$LAME_VERSION.tar.gz.
          su3-build-scripts.tar.gz holds the build scripts (build/ffmpeg/*.sh, with the configure
          options) and build/versions.env, so the binaries can be rebuilt and the shared libraries
          replaced by a modified version. FFmpeg and LAME are linked dynamically.

          su3-prebuilt-<platform>.tar.gz: extract at the repository root (tool/fetch_prebuilt.sh).
          Each archive carries the license texts of FFmpeg (LGPL 2.1 or later) and LAME (LGPL) in prebuilt/licenses/.
          EOF

      - name: Checksums
        working-directory: release
        run: |
          sha256sum * > ../SHA256SUMS
          mv ../SHA256SUMS .
          cat SHA256SUMS

      # A tag is used once: if this job fails, delete the tag and the partial Release, or move to
      # prebuilt-v<N+1>. Try the build with workflow_dispatch before pushing a tag.
      - name: Create the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --verify-tag \
            --title "Prebuilt libraries $GITHUB_REF_NAME" \
            --notes-file release/BUILD-INFO.txt
