# Keeps the SHA-pinned actions and the pub dependencies current. Pull requests target develop, like
# every other change.
#
# The pub entries fail with "directory not found" in the Dependabot tab until the package and the
# example app are scaffolded (docs/project_plan.md section 7, Step 1). Every new dependency still
# needs a license check (CLAUDE.md, "Hard constraints"), so review these pull requests with the
# license-auditor agent.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    # Lets a compromised release be noticed and pulled before it is proposed.
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: pub
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
    groups:
      pub-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pub
    directory: /example
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
    groups:
      pub-example-minor-and-patch:
        update-types: [minor, patch]
